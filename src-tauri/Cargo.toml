[package]
name = "orteca"
version = "0.1.0"
edition = "2021"
# 1.77.2 is the floor, not 1.77: earlier releases mis-escape arguments passed
# to a .bat/.cmd file (CVE-2024-24576), and both provider CLIs install on
# Windows as npm .cmd shims that Orteca spawns with a user-written prompt.
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time"] }
tauri-plugin-single-instance = "2"
tree-sitter = "0.26.13"
tree-sitter-php = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-rust = "0.24.2"
streaming-iterator = "0.1.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  # CreateJobObjectW takes SECURITY_ATTRIBUTES, so it is gated behind this.
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
strip = true
lto = true
